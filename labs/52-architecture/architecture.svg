<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" font-family="Helvetica, Arial, sans-serif" fill="#1a202c" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dd6b20"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
  </defs>

  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="700">Lab 52 — Architecture : quote-app + PostgreSQL sur k3s</text>

  <!-- ============ BOÎTES IMBRIQUÉES (« tourne dans ») ============ -->
  <rect x="290" y="50" width="890" height="920" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <text x="305" y="76" font-size="13" font-weight="700" fill="#555">Matériel hôte (CPU, RAM, disque physique)</text>

  <rect x="305" y="90" width="860" height="865" rx="10" fill="#ececf8" stroke="#6b6bb5" stroke-width="2"/>
  <text x="320" y="115" font-size="13" font-weight="700" fill="#4a4a95">Hyperviseur (fournit la frontière de la VM)</text>

  <rect x="320" y="130" width="830" height="810" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="335" y="155" font-size="13" font-weight="700" fill="#2b6cb0">VM Ubuntu « devops-vm » = nœud Kubernetes (k3s)</text>

  <!-- Nœud k3s -->
  <rect x="340" y="250" width="790" height="565" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="355" y="272" font-size="13" font-weight="700" fill="#2b6cb0">Nœud k3s — conteneurs lancés par containerd</text>

  <!-- Namespace -->
  <rect x="355" y="285" width="760" height="515" rx="8" fill="#fffef6" stroke="#b59b2b" stroke-width="1.5"/>
  <text x="370" y="307" font-size="13" font-weight="700" fill="#8a7413">namespace quote-lab</text>

  <!-- ============ LIGNE APP ============ -->
  <rect x="580" y="320" width="520" height="160" rx="8" fill="#eaf7ee" stroke="#2f855a" stroke-width="1.5"/>
  <text x="595" y="342" font-size="13" font-weight="700" fill="#2f855a">Deployment quote-app · replicas: 1</text>
  <rect x="595" y="352" width="490" height="112" rx="6" fill="#ffffff" stroke="#2f855a"/>
  <text x="610" y="372" font-size="12.5" font-weight="700">Pod quote-app-…</text>
  <rect x="610" y="382" width="460" height="68" rx="5" fill="#d9efe0" stroke="#2f855a"/>
  <text x="622" y="402" font-size="13" font-weight="700">conteneur quote-app</text>
  <text x="622" y="419" font-size="12">image quote-app:local · port 3000</text>
  <text x="622" y="436" font-size="12">probes readiness / liveness sur /health</text>

  <rect x="370" y="415" width="170" height="70" rx="6" fill="#fff3da" stroke="#c0841a" stroke-width="1.5"/>
  <text x="385" y="437" font-size="13" font-weight="700">Service quote-app</text>
  <text x="385" y="455" font-size="12">ClusterIP</text>
  <text x="385" y="472" font-size="12">:80 → 3000</text>

  <!-- Client dans le cluster (Lab 42) -->
  <rect x="370" y="325" width="170" height="60" rx="6" fill="#ffffff" stroke="#1a202c" stroke-width="1.2"/>
  <text x="383" y="347" font-size="12.5" font-weight="700">Client dans le cluster</text>
  <text x="383" y="365" font-size="12">(Lab 42, Pod temporaire)</text>
  <text x="383" y="379" font-size="11" fill="#555">http://quote-app</text>

  <!-- ============ LIGNE BASE ============ -->
  <rect x="580" y="540" width="520" height="170" rx="8" fill="#f4ecfa" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="595" y="562" font-size="13" font-weight="700" fill="#7b3fa0">Deployment quote-db · replicas: 1 · Recreate</text>
  <rect x="595" y="572" width="490" height="128" rx="6" fill="#ffffff" stroke="#7b3fa0"/>
  <text x="610" y="592" font-size="12.5" font-weight="700">Pod quote-db-…</text>
  <rect x="610" y="602" width="460" height="62" rx="5" fill="#e6d6f2" stroke="#7b3fa0"/>
  <text x="622" y="624" font-size="13" font-weight="700">conteneur postgres</text>
  <text x="622" y="643" font-size="12">image postgres:18 · port 5432</text>
  <text x="610" y="687" font-size="11.5" fill="#444">volumes : data (PVC) · init (ConfigMap) · env (Secret)</text>

  <rect x="370" y="570" width="170" height="70" rx="6" fill="#fff3da" stroke="#c0841a" stroke-width="1.5"/>
  <text x="385" y="592" font-size="13" font-weight="700">Service quote-db</text>
  <text x="385" y="610" font-size="12">ClusterIP</text>
  <text x="385" y="627" font-size="12">:5432 → 5432</text>

  <rect x="370" y="665" width="170" height="45" rx="5" fill="#ffffff" stroke="#888" stroke-dasharray="3 3"/>
  <text x="380" y="684" font-size="11.5" font-weight="700">Secret quote-db-secret</text>
  <text x="380" y="700" font-size="11" fill="#555">(référence seulement)</text>
  <rect x="370" y="720" width="170" height="45" rx="5" fill="#ffffff" stroke="#888" stroke-dasharray="3 3"/>
  <text x="380" y="739" font-size="11.5" font-weight="700">ConfigMap quote-db-init</text>
  <text x="380" y="755" font-size="11" fill="#555">(init.sql, 1er démarrage)</text>

  <rect x="780" y="735" width="320" height="50" rx="6" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
  <text x="795" y="755" font-size="13" font-weight="700" fill="#c53030">PVC quote-db-data</text>
  <text x="795" y="773" font-size="12">1Gi · RWO · local-path · Bound</text>

  <!-- ============ NOYAU + DISQUE (dans la VM) ============ -->
  <rect x="340" y="830" width="790" height="45" rx="6" fill="#dfe7f0" stroke="#4a5568" stroke-width="1.5"/>
  <text x="355" y="848" font-size="13" font-weight="700">Noyau Linux invité (guest kernel) de la VM</text>
  <text x="355" y="865" font-size="12">partagé par TOUS les conteneurs : app, postgres, k3s…</text>

  <rect x="340" y="885" width="790" height="45" rx="6" fill="#fdeede" stroke="#c05621" stroke-width="1.5"/>
  <text x="355" y="903" font-size="13" font-weight="700">Disque virtuel de la VM (fichier de disque géré par l’hyperviseur)</text>
  <text x="355" y="920" font-size="11.5">/var/lib/rancher/k3s/storage/pvc-…_quote-lab_quote-db-data</text>

  <!-- ============ CLIENT EXTERNE ============ -->
  <rect x="20" y="160" width="230" height="76" rx="8" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <text x="35" y="182" font-size="13" font-weight="700">Laptop (client)</text>
  <text x="35" y="200" font-size="12">navigateur ou terminal SSH</text>
  <text x="35" y="218" font-size="12">curl 127.0.0.1:8080</text>

  <!-- Process port-forward dans la VM -->
  <rect x="780" y="170" width="350" height="56" rx="6" fill="#fff4e5" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="793" y="192" font-size="12.5" font-weight="700">kubectl port-forward svc/quote-app 8080:80</text>
  <text x="793" y="212" font-size="12">écoute sur 127.0.0.1:8080 — temporaire</text>

  <!-- ============ FLÈCHES DE TRAFIC ============ -->
  <!-- laptop -> VM (port-forward) -->
  <line x1="250" y1="198" x2="778" y2="198" stroke="#1a202c" stroke-width="2" marker-end="url(#ad)"/>
  <text x="520" y="188" font-size="12" text-anchor="middle">accès laptop → VM (SSH / réseau)</text>
  <text x="520" y="216" font-size="12" text-anchor="middle">arrive sur 127.0.0.1:8080 dans la VM</text>

  <!-- port-forward -> UN Pod (pas via le Service) -->
  <line x1="1050" y1="226" x2="1050" y2="350" stroke="#dd6b20" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/>
  <text x="1040" y="298" font-size="12" text-anchor="end" fill="#b34f0a" font-weight="700">sélectionne UN seul Pod</text>
  <text x="1040" y="312" font-size="11.5" text-anchor="end" fill="#b34f0a">(ne montre pas la répartition du Service)</text>

  <!-- client in-cluster -> Service app -->
  <line x1="455" y1="385" x2="455" y2="413" stroke="#1a202c" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Service app -> Pod app -->
  <line x1="540" y1="430" x2="593" y2="430" stroke="#1a202c" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Pod app -> Service db -->
  <path d="M700 464 L700 510 L455 510 L455 568" fill="none" stroke="#1a202c" stroke-width="2" marker-end="url(#ad)"/>
  <text x="470" y="528" font-size="12">SQL : DATABASE_URL → quote-db:5432</text>

  <!-- Service db -> Pod db -->
  <line x1="540" y1="605" x2="593" y2="605" stroke="#1a202c" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Pod db -> PVC -> disque (stockage) -->
  <line x1="950" y1="700" x2="950" y2="733" stroke="#2f855a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="940" y="724" font-size="11.5" text-anchor="end" fill="#2f855a">monté sur /var/lib/postgresql</text>
  <line x1="1050" y1="785" x2="1050" y2="883" stroke="#2f855a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1040" y="808" font-size="11.5" text-anchor="end" fill="#2f855a">données écrites sur le disque de la VM</text>

  <!-- ============ LÉGENDE ============ -->
  <rect x="20" y="330" width="250" height="190" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="32" y="352" font-size="13" font-weight="700">Légende</text>
  <line x1="32" y1="378" x2="82" y2="378" stroke="#1a202c" stroke-width="2" marker-end="url(#ad)"/>
  <text x="95" y="382" font-size="12">trafic réseau (requête)</text>
  <line x1="32" y1="406" x2="82" y2="406" stroke="#dd6b20" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/>
  <text x="95" y="410" font-size="12">port-forward (temporaire)</text>
  <line x1="32" y1="434" x2="82" y2="434" stroke="#2f855a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="95" y="438" font-size="12">stockage des données</text>
  <rect x="32" y="452" width="50" height="30" rx="4" fill="#e8f1fb" stroke="#2b6cb0"/>
  <rect x="42" y="460" width="30" height="14" rx="3" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="95" y="472" font-size="12">« tourne dans » (imbriqué)</text>
  <text x="32" y="505" font-size="11" fill="#555">pointillés gris = référence / config</text>

  <!-- ============ NOTES ============ -->
  <rect x="20" y="550" width="250" height="290" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="32" y="572" font-size="13" font-weight="700">À retenir</text>
  <text font-size="12">
    <tspan x="32" y="598">• Port-forward ≠ Service :</tspan>
    <tspan x="42" y="614">il vise UN Pod, il ne montre</tspan>
    <tspan x="42" y="630">pas la répartition du Service.</tspan>
    <tspan x="32" y="662">• Les conteneurs app et base</tspan>
    <tspan x="42" y="678">partagent le noyau de la VM.</tspan>
    <tspan x="32" y="710">• Hyperviseur = frontière de</tspan>
    <tspan x="42" y="726">la VM ; Kubernetes gère les</tspan>
    <tspan x="42" y="742">workloads dans la VM.</tspan>
    <tspan x="32" y="774">• PVC local-path = disque de</tspan>
    <tspan x="42" y="790">la VM : pas de reprise si la</tspan>
    <tspan x="42" y="806">VM ou le disque est perdu.</tspan>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
